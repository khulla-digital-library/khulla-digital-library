name: Release

# Push a tag to publish a release:
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# Run it by hand ("Run workflow" in the Actions tab) to get the same set of
# builds as downloadable artifacts without publishing anything — that is how a
# tester gets a build of an unreleased branch.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      release: ${{ steps.resolve.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the version being built
        id: resolve
        shell: bash
        run: |
          # pubspec carries `version: 1.2.3+4`; the tag carries `v1.2.3`.
          pubspec="$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/v}"
            if [[ "$tag" != "$pubspec" ]]; then
              echo "::error::Tag v$tag does not match the pubspec version $pubspec." \
                   "Bump pubspec.yaml and retag, so the About screen agrees with the download."
              exit 1
            fi
            echo "version=$tag" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=$pubspec-dev.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report
        run: |
          echo "Building ${{ steps.resolve.outputs.version }} (publish a release: ${{ steps.resolve.outputs.release }})" \
            >> "$GITHUB_STEP_SUMMARY"

  windows:
    name: Windows
    needs: version
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-flutter
        with:
          bootstrap: pub

      - name: Build
        run: flutter build windows --release -t lib/main_prod.dart

      # A portable folder, not an installer: unzip anywhere and run khulla.exe.
      # The catalogue lives in the user's application-support directory, so
      # moving or replacing this folder never touches library data.
      - name: Package
        shell: pwsh
        run: |
          $name = "khulla-${{ needs.version.outputs.version }}-windows-x64"
          New-Item -ItemType Directory -Path dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "dist/$name.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  linux:
    name: Linux
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install the Linux desktop toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libcups2-dev

      - uses: ./.github/actions/setup-flutter
        with:
          bootstrap: pub

      - name: Build
        run: flutter build linux --release -t lib/main_prod.dart

      - name: Package
        run: |
          name="khulla-${{ needs.version.outputs.version }}-linux-x64"
          mkdir -p dist
          tar -czf "dist/$name.tar.gz" -C build/linux/x64/release/bundle .

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  android:
    name: Android
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: ./.github/actions/setup-flutter
        with:
          bootstrap: pub

      # One universal APK rather than per-ABI splits: a tester sideloading from
      # a release page should not have to know what a CPU architecture is.
      # Signed with debug keys (see android/app/build.gradle.kts) — fine for
      # sideloading, not for Play. docs/contributing/releasing.md says how to
      # add a real signing key when that day comes.
      - name: Build
        run: flutter build apk --release -t lib/main_prod.dart

      - name: Package
        run: |
          name="khulla-${{ needs.version.outputs.version }}-android"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/$name.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*
          if-no-files-found: error

  web:
    name: Web
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-flutter
        with:
          bootstrap: pub

      # Built at the site root, for a library serving it from its own host. The
      # GitHub Pages demo is built separately by deploy-web.yaml, which needs a
      # different base href.
      - name: Build
        run: flutter build web --release -t lib/main_prod.dart

      - name: Package
        run: |
          name="khulla-${{ needs.version.outputs.version }}-web"
          mkdir -p dist
          tar -czf "dist/$name.tar.gz" -C build/web .

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    if: needs.version.outputs.release == 'true'
    needs: [version, windows, linux, android, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect and checksum
        run: |
          mkdir -p dist
          find artifacts -type f -exec mv {} dist/ \;
          cd dist
          sha256sum * > SHA256SUMS.txt
          ls -lh

      - uses: softprops/action-gh-release@v2
        with:
          name: Khulla ${{ needs.version.outputs.version }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
          body: |
            ## Downloads

            | Platform | File | How to run it |
            | --- | --- | --- |
            | Windows | `khulla-${{ needs.version.outputs.version }}-windows-x64.zip` | Unzip anywhere, run `khulla.exe`. Windows SmartScreen will warn about an unknown publisher — *More info* → *Run anyway*. |
            | Android | `khulla-${{ needs.version.outputs.version }}-android.apk` | Sideload it; allow installs from your browser or file manager. |
            | Web | `khulla-${{ needs.version.outputs.version }}-web.tar.gz` | Serve the extracted folder from any static host. |
            | Linux | `khulla-${{ needs.version.outputs.version }}-linux-x64.tar.gz` | Extract and run `./khulla`. |

            Verify a download against `SHA256SUMS.txt`.

            Khulla is local-first: your catalogue is a SQLite file on your own
            machine, and nothing is sent anywhere. Uninstalling the app does not
            delete it — take a backup from **Settings → Backup** before moving
            between machines.
