name: CI

on:
  push:
    branches: [dev, prod]
  pull_request:
    branches: [dev, prod]
  workflow_dispatch:

# A new push to a pull request makes the previous run's answer irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-flutter
        with:
          bootstrap: melos

      - name: Format, copyright, analysis, tests
        run: make ci

  build-web:
    name: Build web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-flutter
        with:
          bootstrap: pub

      # Analysis does not compile — this is what catches a change that passes
      # `dart analyze` but breaks the release build.
      - name: Build web (prod flavor)
        run: flutter build web --release -t lib/main_prod.dart
