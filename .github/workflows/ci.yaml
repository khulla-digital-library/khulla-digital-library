name: CI

on:
  push:
    branches: [prod, dev]
  pull_request:
    branches: [prod, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.0"

jobs:
  verify:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Bootstrap workspace
        run: |
          flutter pub get
          dart run melos bootstrap

      # Generated sources are not committed, so nothing analyzes until these
      # have run. Keep this step ahead of every check below.
      - name: Generate code
        run: |
          flutter gen-l10n
          dart run build_runner build

      - name: Verify formatting
        run: dart run melos exec --concurrency=1 -- dart format --set-exit-if-changed .

      - name: Analyze
        run: dart run melos run analyze

      - name: Test
        run: dart run melos run test

  build-web:
    name: Build web
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Bootstrap workspace
        run: |
          flutter pub get
          dart run melos bootstrap

      - name: Generate code
        run: |
          flutter gen-l10n
          dart run build_runner build

      - name: Build
        run: flutter build web -t lib/main_prod.dart

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Bootstrap workspace
        run: |
          flutter pub get
          dart run melos bootstrap

      - name: Generate code
        run: |
          flutter gen-l10n
          dart run build_runner build

      - name: Build
        run: flutter build windows -t lib/main_prod.dart
