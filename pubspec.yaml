name: khulla
description: "Khulla Digital Library - an open-source library management system."
publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  # Flutter SDK
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  bloc: ^9.2.1
  equatable: ^2.1.0
  flutter_bloc: ^9.1.1
  formz: ^0.8.1

  # Navigation
  go_router: ^18.0.0

  # Dependency injection
  get_it: ^9.2.1
  injectable: ^3.0.0

  # Local database — drift over sqlite3. One typed API across every target:
  # a background isolate on native, sqlite3-in-WebAssembly on web.
  # See docs/architecture/0002-drift-for-persistence.md.
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  sqlite3: ^3.5.2

  # Paths & key-value storage
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5

  # Password hashing for local accounts. Pure Dart (a jBCrypt port), so
  # it runs identically on desktop, mobile and web — no FFI, no native build.
  bcrypt: ^1.2.0
  crypto: ^3.0.7
  file_selector: ^1.0.3

  # Stable record identifiers, generated on the device.
  uuid: ^4.5.1

  # Serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Localization
  intl: ^0.20.3

  # Desktop window chrome (Windows, Linux, macOS)
  window_manager: ^0.5.2

  # Design system (internal package)
  khulla_ui:
    path: packages/khulla_ui

  # UI
  cupertino_icons: ^1.0.9
  toastification: ^3.2.0

dev_dependencies:
  # Code generation
  build_runner: ^2.16.0
  drift_dev: ^2.34.3
  flutter_gen_runner: ^5.15.0
  freezed: ^4.0.0
  injectable_generator: ^3.1.3
  json_serializable: ^6.14.1

  # Testing
  flutter_test:
    sdk: flutter

  # Code quality & linting
  bloc_lint: ^0.4.2
  flutter_lints: ^6.0.0
  husky: ^0.1.7

  # Monorepo tooling (config in melos.yaml — not pub workspaces)
  melos: ^6.3.2

# FlutterGen code generation for assets, fonts and colors.
# Generated output lives in lib/gen/ and is regenerated via:
#   dart run build_runner build
# See https://pub.dev/packages/flutter_gen_runner
flutter_gen:
  output: lib/gen/

flutter:
  # Material Icons
  uses-material-design: true

  # Flutter code generation (l10n)
  generate: true

  # Assets
  assets:
    - assets/images/
    - assets/images/logos/
