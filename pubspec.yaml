name: khulla
description: "Khulla Digital Library - an open-source library management system."
publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  # Flutter SDK
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  bloc: ^9.2.1
  equatable: ^2.1.0
  flutter_bloc: ^9.1.1
  formz: ^0.8.1

  # Navigation
  go_router: ^18.0.0

  # Dependency injection
  get_it: ^9.2.1
  injectable: ^3.0.0

  # Local database — one API (sqflite_common) over three platform backends:
  # sqflite (mobile), sqflite_common_ffi (desktop), sqflite_common_ffi_web (web).
  sqflite: ^2.4.3
  sqflite_common: ^2.5.11
  sqflite_common_ffi: ^2.4.2+1
  sqflite_common_ffi_web: ^1.1.2

  # Paths & key-value storage
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5

  # Serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Localization
  intl: ^0.20.3

  # Desktop window chrome (Windows, Linux, macOS)
  window_manager: ^0.5.2

  # Design system (internal package)
  khulla_ui:
    path: packages/khulla_ui

  # UI
  cupertino_icons: ^1.0.9
  toastification: ^3.2.0

dev_dependencies:
  # Code generation
  build_runner: ^2.16.0
  flutter_gen_runner: ^5.15.0
  freezed: ^4.0.0
  injectable_generator: ^3.1.3
  json_serializable: ^6.14.1

  # Testing
  flutter_test:
    sdk: flutter

  # Code quality & linting
  bloc_lint: ^0.4.2
  flutter_lints: ^6.0.0
  husky: ^0.1.7

  # Monorepo tooling (config in melos.yaml — not pub workspaces)
  melos: ^6.3.2

# FlutterGen code generation for assets, fonts and colors.
# Generated output lives in lib/gen/ and is regenerated via:
#   dart run build_runner build
# See https://pub.dev/packages/flutter_gen_runner
flutter_gen:
  output: lib/gen/

flutter:
  # Material Icons
  uses-material-design: true

  # Flutter code generation (l10n)
  generate: true

  # Assets
  assets:
    - assets/icons/
    - assets/images/
