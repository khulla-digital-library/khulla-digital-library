name: khulla
version: 0.1.0
summary: Generated by Icons Launcher
description: Generated by Icons Launcher package for Linux.

confinement: strict
base: core22
grade: stable

slots:
  dbus-khulla: # adjust accordingly to your app name
    interface: dbus
    bus: session
    name: org.bar.khulla # adjust accordingly to your app name

apps:
  khulla:
    command: khulla
    extensions: [gnome] # gnome includes the libraries required by flutter
    plugs:
    - network
    slots:
      - dbus-khulla
parts:
  khulla:
    source: .
    plugin: flutter
    flutter-target: lib/main.dart # The main entry-point file of the application
